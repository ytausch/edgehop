name: Update lockfiles
on:
  workflow_dispatch:
  schedule:
    - cron: 0 5 1 * *

permissions:
  contents: read

jobs:
  pixi-update:
    name: Update pixi lockfile
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: update-pixi
      TITLE: "chore: Update pixi lockfile"
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          run-install: false
      - name: Update lockfile
        run: pixi update --json --no-install | pixi exec pixi-diff-to-markdown > "$RUNNER_TEMP/diff.md"
      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if git diff --quiet -- pixi.lock; then
            echo "pixi.lock is up to date."
            if [ -n "$pr" ]; then
              gh pr close "$pr" --delete-branch --comment "pixi.lock is up to date on main."
            fi
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git commit --message "$TITLE" -- pixi.lock
          gh auth setup-git
          git push --force origin "$BRANCH"

          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/diff.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" \
              --body-file "$RUNNER_TEMP/diff.md" --label dependencies
          fi
