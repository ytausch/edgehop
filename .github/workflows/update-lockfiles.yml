name: Update lockfiles
on:
  workflow_dispatch:
  schedule:
    - cron: 43 4 1 * *

permissions:
  contents: read

jobs:
  pixi-update:
    name: Update pixi lockfile
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          run-install: false
      - name: Update lockfile
        run: pixi update --json --no-install | pixi exec pixi-diff-to-markdown > "$RUNNER_TEMP/diff.md"
      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          commit-message: "chore: Update pixi lockfile"
          title: "chore: Update pixi lockfile"
          body-path: ${{ runner.temp }}/diff.md
          branch: update-pixi
          base: main
          labels: dependencies
          delete-branch: true
          add-paths: pixi.lock
