version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      gh-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      rust-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    labels:
      - dependencies
  # Every nixpkgs bump changes the Nix-built binary, and macOS then asks for
  # the Input Monitoring grant again. The compiler is all nixpkgs provides.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: yearly
    commit-message:
      prefix: build
    labels:
      - dependencies
