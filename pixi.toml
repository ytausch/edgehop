[workspace]
name = "edgehop"
channels = ["conda-forge"]
exclude-newer = "7d"
platforms = ["osx-arm64", "win-64"]

[dependencies]
cargo-llvm-cov = "*"
cargo-mutants = "*"

[tasks]
# The OS glue in src/main.rs and src/sys/ needs real hardware and is kept thin;
# everything else must be covered completely.
coverage = "cargo llvm-cov --ignore-filename-regex 'src[/\\\\](main\\.rs|sys[/\\\\])' --show-missing-lines --fail-under-lines 100"
mutants = "cargo mutants --gitignore=true"

[feature.lint.dependencies]
lefthook = "*"
prettier = "*"
taplo = "*"
pre-commit-hooks = "*"
typos = "*"
zizmor = "*"

[feature.lint.tasks]
pre-commit-install = "lefthook install"
lint = "lefthook run pre-commit --all-files"
# Until cargo-about is on conda-forge: a pinned build in the pixi directory.
install-cargo-about = "cargo install --locked --quiet --features cli cargo-about@0.9.2 --root .pixi/cargo-about"
# Fetches first, so the generation itself runs offline and does not depend on
# license files fetched from the network.
licenses = { cmd = "cargo fetch --locked --quiet && .pixi/cargo-about/bin/cargo-about generate --frozen --fail about.hbs -o THIRD_PARTY_LICENSES.txt", depends-on = [
  "install-cargo-about",
] }

[environments]
default = ["lint"]
