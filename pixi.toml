[workspace]
name = "edgehop"
channels = ["conda-forge"]
exclude-newer = "7d"
platforms = ["osx-arm64", "win-64"]

[exclude-newer]
# TODO: Remove after 2026-10-05, when the 7d cutoff covers cargo-about 0.9.2
# (published to conda-forge on 2026-09-28).
cargo-about = "0d"

[dependencies]
# The Cargo subcommands here are static binaries; the Rust toolchain itself
# comes from rustup, outside of the pixi environment.
cargo-auditable = "*"
cargo-llvm-cov = "*"
cargo-mutants = "*"

[tasks]
# The OS glue in src/main.rs and src/sys/ needs real hardware and is kept thin;
# everything else must be covered completely.
coverage = "cargo llvm-cov --ignore-filename-regex 'src[/\\\\](main\\.rs|sys[/\\\\])' --show-missing-lines --fail-under-lines 100"
mutants = "cargo mutants --gitignore=true"

[feature.lint.dependencies]
cargo-about = "*"
lefthook = "*"
prettier = "*"
taplo = "*"
pre-commit-hooks = "*"
typos = "*"
zizmor = "*"

[feature.lint.tasks]
pre-commit-install = "lefthook install"
lint = "lefthook run pre-commit --all-files"
# Fetches first, so the generation itself runs offline and does not depend on
# license files fetched from the network.
licenses = "cargo fetch --locked --quiet && cargo about generate --frozen --fail about.hbs -o THIRD_PARTY_LICENSES.txt"

[environments]
default = ["lint"]
