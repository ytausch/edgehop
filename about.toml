# cargo-about config for THIRD_PARTY_LICENSES.txt, which `edgehop --licenses`
# prints. Regenerated by the lefthook pre-commit hook.

# In priority order: MIT is picked from dual-licensed crates. A new license
# fails the hook until it is added here.
accepted = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0"]
# The release targets; see the build workflow.
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
# They are not part of the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# hidapi statically links the C hidapi library, which is not covered by the
# crate's MIT license. We use it under its BSD license, the one of its three
# options that fits a binary. Remove this once hidapi declares it itself:
# https://github.com/ruabmbua/hidapi-rs/pull/186
[hidapi.clarify]
license = "MIT AND BSD-3-Clause"

[[hidapi.clarify.files]]
path = "LICENSE.txt"
license = "MIT"
checksum = "778d971f6152990cee1644e7aadcd51a68050dd73f76463c5a9c1863ca495d73"

[[hidapi.clarify.files]]
path = "etc/hidapi/LICENSE-bsd.txt"
license = "BSD-3-Clause"
checksum = "30eb1bef29b46f8ba7ab8b416035dbd93cb034a45481dd97815b944284582cd2"
